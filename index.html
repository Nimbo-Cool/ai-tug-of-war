<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧雙人拔河大對決</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; user-select: none; }
        .rope-transition { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
        .shake { animation: shake 0.4s; }
        @keyframes popUp { 0%{opacity:0;transform:translate(-50%,10px) scale(.8)} 20%{opacity:1;transform:translate(-50%,0) scale(1.15)} 80%{opacity:1} 100%{opacity:0;transform:translate(-50%,-30px) scale(1)} }
        .pop { animation: popUp 1.2s forwards; }
        .opt-correct { background:#16a34a !important; border-color:#4ade80 !important; color:#fff !important; box-shadow:0 0 0 3px rgba(74,222,128,.35); }
        .opt-wrong { background:#dc2626 !important; border-color:#f87171 !important; color:#fff !important; }
        .opt-reveal { background:rgba(22,163,74,.25) !important; border-color:#4ade80 !important; border-style:dashed !important; }
        .opt-dim { opacity:.35; }
        .panel-flash-ok { box-shadow:0 0 0 4px #4ade80, 0 0 30px rgba(74,222,128,.5) !important; }
        .panel-flash-bad { box-shadow:0 0 0 4px #f87171, 0 0 30px rgba(248,113,113,.5) !important; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- 上方控制區與標題 -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🪢</span>
                <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-red-400 via-amber-300 to-blue-400">
                    AI 智慧雙人拔河大對決
                </h1>
            </div>

            <!-- 切換選單按鈕 -->
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="openMenuModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-gear"></i> 設定 API / 切換題庫
                </button>
            </div>
        </div>
    </header>

    <!-- 遊戲主舞台 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col justify-between relative">
        
        <!-- 拔河比分與進度條 -->
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 mb-4 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-2">
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded-full bg-red-500 inline-block animate-ping"></span>
                    <span class="font-bold text-red-400 text-lg">紅隊（左邊）</span>
                    <span class="text-xs font-bold bg-slate-900 px-2 py-0.5 rounded-md"><span class="text-green-400">✔ <span id="leftCorrect">0</span></span> <span class="text-red-400 ml-1">✘ <span id="leftWrong">0</span></span></span>
                </div>
                <div class="text-center">
                    <span id="questionProgress" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-mono">第 1 / 10 題</span>
                    <div id="timer" class="text-2xl font-black text-amber-400 mt-1">15</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold bg-slate-900 px-2 py-0.5 rounded-md"><span class="text-green-400">✔ <span id="rightCorrect">0</span></span> <span class="text-red-400 ml-1">✘ <span id="rightWrong">0</span></span></span>
                    <span class="font-bold text-blue-400 text-lg">藍隊（右邊）</span>
                    <span class="w-4 h-4 rounded-full bg-blue-500 inline-block animate-ping"></span>
                </div>
            </div>

            <!-- 拔河賽道 -->
            <div class="relative h-20 bg-slate-900 rounded-xl overflow-hidden border-2 border-slate-700 flex items-center justify-center">
                <div class="absolute inset-y-0 w-1 bg-amber-400 z-10 left-1/2 -translate-x-1/2 opacity-70"></div>
                <div class="absolute top-1 left-1/2 -translate-x-1/2 text-[10px] text-amber-400 font-mono z-10">勝負中線</div>

                <!-- 繩子與人物容器 -->
                <div id="ropeContainer" class="absolute w-full flex items-center justify-center rope-transition" style="transform: translateX(0px);">
                    <div class="flex items-center gap-1 mr-[-10px]">
                        <span class="text-4xl transform -scale-x-100">🤼</span>
                        <span class="text-3xl transform -scale-x-100">🧒</span>
                    </div>
                    <div class="w-2/3 h-4 bg-amber-700 border-y-2 border-amber-900 relative flex items-center justify-center shadow-inner">
                        <div class="w-6 h-8 bg-red-600 rounded-sm shadow-md animate-bounce"></div>
                    </div>
                    <div class="flex items-center gap-1 ml-[-10px]">
                        <span class="text-3xl">🧒</span>
                        <span class="text-4xl">🤼</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 題目顯示區 -->
        <div class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700 shadow-2xl min-h-[140px] flex flex-col justify-center items-center text-center my-2 relative">
            <div id="topicTag" class="absolute top-3 left-4 text-xs font-bold text-indigo-400 bg-indigo-950/80 border border-indigo-800 px-2.5 py-1 rounded-md">
                題庫：預設基礎題庫
            </div>
            <div id="questionBadge" class="hidden absolute top-3 right-4 text-xs font-black text-emerald-300 bg-emerald-950/80 border border-emerald-600 px-2.5 py-1 rounded-md">
                🔭 延伸挑戰題
            </div>
            <h2 id="questionText" class="text-xl md:text-2xl font-bold leading-relaxed text-slate-100 mt-4">
                請在設定選單中選擇或上傳題庫開始比賽！
            </h2>
            <p id="explainText" class="hidden mt-3 text-sm md:text-base font-bold text-green-300 bg-green-950/60 border border-green-700 px-4 py-2 rounded-xl"></p>
        </div>

        <!-- 雙人搶答選項區（左隊 vs 右隊） -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-2">
            <!-- 紅隊選項區 -->
            <div id="leftPanel" class="relative bg-red-950/30 border-2 border-red-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2 transition-shadow">
                <span id="leftPop" class="absolute left-1/2 top-1/2 z-20 text-4xl font-black pointer-events-none opacity-0 whitespace-nowrap drop-shadow-lg"></span>
                <div class="text-xs font-bold text-red-400 flex justify-between items-center mb-1">
                    <span>🔴 紅隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：Q, W, E, R</span>
                </div>
                <div id="leftOptions" class="grid grid-cols-1 gap-2"></div>
            </div>

            <!-- 藍隊選項區 -->
            <div id="rightPanel" class="relative bg-blue-950/30 border-2 border-blue-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2 transition-shadow">
                <span id="rightPop" class="absolute left-1/2 top-1/2 z-20 text-4xl font-black pointer-events-none opacity-0 whitespace-nowrap drop-shadow-lg"></span>
                <div class="text-xs font-bold text-blue-400 flex justify-between items-center mb-1">
                    <span>🔵 藍隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：U, I, O, P</span>
                </div>
                <div id="rightOptions" class="grid grid-cols-1 gap-2"></div>
            </div>
        </div>

    </main>

    <!-- 啟動 Modal 視窗 -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
        <div id="overlayContent" class="max-w-md w-full bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-5 my-auto">
            <div>
                <div class="text-5xl mb-2">🪢</div>
                <h3 id="overlayTitle" class="text-2xl font-black text-amber-400">AI 智慧拔河大對決</h3>
                <p id="overlayDesc" class="text-slate-300 text-xs mt-1">設定 API Key 與題庫開始遊戲：</p>
            </div>

            <!-- 比賽結算 -->
            <div id="resultArea" class="hidden grid grid-cols-2 gap-3 text-left"></div>

            <div id="setupSections" class="space-y-5">
            <!-- 1. AI 來源切換 + API Key 輸入框（自動記憶於瀏覽器） -->
            <div class="bg-slate-900/80 border border-amber-500/40 p-4 rounded-xl text-left space-y-2">
                <div class="grid grid-cols-2 gap-2 mb-1">
                    <button type="button" id="btnGemini" onclick="switchProvider('gemini')" class="py-2 rounded-lg text-xs font-bold transition border">
                        ✨ Gemini（免費）
                    </button>
                    <button type="button" id="btnOpenAI" onclick="switchProvider('openai')" class="py-2 rounded-lg text-xs font-bold transition border">
                        🤖 GPT（需儲值）
                    </button>
                </div>
                <label class="block text-xs font-bold text-amber-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-amber-400"></i> <span id="keyLabel">Gemini API Key 設定：</span>
                </label>
                <div class="relative">
                    <input type="password" id="apiKeyInputModal" onchange="saveApiKeyFromModal()" placeholder="請貼上您的 Gemini API Key..." 
                        class="w-full bg-slate-800 border border-slate-600 focus:border-amber-400 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none transition pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white text-xs">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between gap-2">
                    <p class="text-[11px] text-slate-400">輕點輸入框外即可自動儲存。金鑰僅儲存於個人瀏覽器。</p>
                    <button type="button" onclick="testConnection()" class="shrink-0 px-2.5 py-1 bg-amber-600 hover:bg-amber-500 rounded-md text-[11px] font-bold transition">
                        <i class="fa-solid fa-plug"></i> 測試連線
                    </button>
                </div>
                <p id="connStatus" class="text-[11px] font-bold hidden"></p>
            </div>

            <!-- 出題設定：年級與延伸程度 -->
            <div class="bg-slate-900/80 border border-emerald-500/40 p-4 rounded-xl text-left grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-emerald-300 mb-1.5">🎒 學生年級</label>
                    <select id="gradeSelect" onchange="saveQuizSettings()" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-lg text-xs font-bold text-slate-100 focus:outline-none focus:border-emerald-400">
                        <option value="1">一年級</option>
                        <option value="2">二年級</option>
                        <option value="3">三年級</option>
                        <option value="4">四年級</option>
                        <option value="5">五年級</option>
                        <option value="6">六年級</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-300 mb-1.5">🔭 延伸程度</label>
                    <select id="extendSelect" onchange="saveQuizSettings()" class="w-full bg-slate-800 border border-slate-600 p-2 rounded-lg text-xs font-bold text-slate-100 focus:outline-none focus:border-emerald-400">
                        <option value="0">只考課本</option>
                        <option value="3">微延伸（約 3 題）</option>
                        <option value="5">多延伸（約 5 題）</option>
                    </select>
                </div>
                <p class="col-span-2 text-[11px] text-slate-400">出完題 AI 會再逐題檢查答案，有疑慮的題目自動剔除。</p>
            </div>

            <!-- 2. 核心功能：上傳教冊 PDF -->
            <div class="bg-indigo-950/50 border-2 border-indigo-500 hover:border-indigo-400 p-5 rounded-2xl text-left transition shadow-lg">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">
                        📄
                    </div>
                    <div>
                        <h4 class="font-bold text-indigo-200 text-base">匯入教師手冊 / 課本檔</h4>
                        <p class="text-xs text-slate-300">上傳教冊 PDF，AI 將直接從全書內容出題</p>
                    </div>
                </div>
                <label class="mt-3 w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white text-center font-extrabold text-sm rounded-xl cursor-pointer block transition shadow-md">
                    <i class="fa-solid fa-file-pdf mr-1.5"></i> 選擇並上傳教冊 PDF
                    <input type="file" id="pdfInputModal" accept=".pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>

            <!-- 3. 次要功能：選擇主題 AI 出題 -->
            <div class="bg-slate-700/50 border border-slate-600 p-4 rounded-xl text-left">
                <label class="block text-xs font-bold text-amber-300 mb-2">✨ 或挑選預設 AI 主題生成題目：</label>
                <select id="topicSelectModal" onchange="generateQuestionsByTopic(this.value)" class="w-full bg-slate-800 border border-slate-600 p-2.5 rounded-lg text-xs font-bold text-slate-100 cursor-pointer focus:outline-none focus:border-amber-400">
                    <option value="" disabled selected>-- 點擊選擇主題（每次出題不同） --</option>
                    <option value="自然科學小常識">🌱 自然科學小常識</option>
                    <option value="成語典故與成語接龍">📚 成語典故與活用</option>
                    <option value="台灣歷史與地理人文">🗺️ 台灣歷史與地理</option>
                    <option value="日常生活生活常識與安全">💡 日常生活與安全常識</option>
                    <option value="國小基礎英文單字與文法">🔤 基礎英文單字與語感</option>
                    <option value="趣味數學邏輯推理">🔢 趣味數學與邏輯腦筋急轉彎</option>
                </select>
            </div>
            </div>

            <!-- 4. 預設按鈕區 -->
            <div id="actionBtnArea" class="pt-1 space-y-2">
                <button id="overlayBtn" onclick="startGame()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold rounded-xl text-sm transition">
                    🚀 直接使用預設題目開始遊戲
                </button>
                <button id="regenBtn" onclick="regenerateQuestions()" class="hidden w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-900 font-extrabold rounded-xl text-sm transition">
                    🔄 用同一份教材，AI 重新出 10 題
                </button>
                <button id="backMenuBtn" onclick="openMenuModal()" class="hidden w-full py-2 text-slate-400 hover:text-white text-xs font-bold transition">
                    ⚙️ 回設定選單（換教材 / 換主題）
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== AI 來源設定 =====
        const PROVIDERS = {
            gemini: {
                name: 'Gemini',
                // 第一個是 Google 官方「自動指向最新 Flash」的別名，舊模型下架也不用改程式
                models: ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest'],
                placeholder: '請貼上您的 Gemini API Key（AIza 開頭）...',
                keyHint: 'AIza 開頭'
            },
            openai: {
                name: 'GPT',
                // 便宜又快的 mini 等級，失敗時自動往下換
                models: ['gpt-5.4-mini', 'gpt-mini-latest', 'gpt-5-mini'],
                placeholder: '請貼上您的 OpenAI API Key（sk- 開頭）...',
                keyHint: 'sk- 開頭'
            }
        };

        let provider = localStorage.getItem('ai_provider') || 'gemini';
        let apiKey = localStorage.getItem(`${provider}_api_key`) || '';
        let workingModel = localStorage.getItem(`${provider}_working_model`) || '';

        function switchProvider(p) {
            saveApiKeyFromModal();
            provider = p;
            localStorage.setItem('ai_provider', p);
            apiKey = localStorage.getItem(`${p}_api_key`) || '';
            workingModel = localStorage.getItem(`${p}_working_model`) || '';
            renderProviderUI();
        }

        function renderProviderUI() {
            const on = 'bg-amber-500 border-amber-400 text-slate-900';
            const off = 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700';
            document.getElementById('btnGemini').className = `py-2 rounded-lg text-xs font-bold transition border ${provider === 'gemini' ? on : off}`;
            document.getElementById('btnOpenAI').className = `py-2 rounded-lg text-xs font-bold transition border ${provider === 'openai' ? on : off}`;
            document.getElementById('keyLabel').innerText = `${PROVIDERS[provider].name} API Key 設定：`;
            const input = document.getElementById('apiKeyInputModal');
            input.placeholder = PROVIDERS[provider].placeholder;
            input.value = apiKey;
            document.getElementById('connStatus').classList.add('hidden');
        }

        let currentQuestions = [];
        let currentQuestionIdx = 0;
        let ropePosition = 0;
        let timerInterval = null;
        let timeLeft = 15;
        let isQuestionActive = false;
        let leftAnswered = false;
        let rightAnswered = false;

        // ===== 計分規則 =====
        const QUESTION_TIME = 15;   // 每題秒數
        const MAX_PULL = 36;        // 一答對就按：拉最多
        const MIN_PULL = 8;         // 最後一秒才答對：拉最少
        const ROPE_LIMIT = 220;     // 繩子最遠位移
        let questionStartTime = 0;
        let revealTimeout = null;
        let stats = null;

        // ===== 出題來源（重新出題用） =====
        let lastSource = null;      // {type:'pdf', name, text} 或 {type:'topic', topic}
        let previousQs = [];        // 已出過的題目，重出時請 AI 避開

        function resetStats() {
            stats = {
                left:  { correct: 0, wrong: 0, none: 0, pull: 0 },
                right: { correct: 0, wrong: 0, none: 0, pull: 0 }
            };
            updateScoreBoard();
        }

        function updateScoreBoard() {
            document.getElementById('leftCorrect').innerText = stats.left.correct;
            document.getElementById('leftWrong').innerText = stats.left.wrong;
            document.getElementById('rightCorrect').innerText = stats.right.correct;
            document.getElementById('rightWrong').innerText = stats.right.wrong;
        }

        // ===== 出題設定（年級、延伸程度）=====
        const GRADE_NAMES = ['', '一', '二', '三', '四', '五', '六'];
        function getQuizSettings() {
            return {
                grade: Number(localStorage.getItem('quiz_grade') || 4),
                extend: Number(localStorage.getItem('quiz_extend') ?? 3)
            };
        }
        function saveQuizSettings() {
            localStorage.setItem('quiz_grade', document.getElementById('gradeSelect').value);
            localStorage.setItem('quiz_extend', document.getElementById('extendSelect').value);
        }
        function renderQuizSettings() {
            const s = getQuizSettings();
            document.getElementById('gradeSelect').value = String(s.grade);
            document.getElementById('extendSelect').value = String(s.extend);
        }

        const JSON_FORMAT = `請嚴格以 JSON 格式輸出陣列，answer 為正確選項的索引（0~3），正確答案的位置請平均分散；
source 標示題目來源："課本" 或 "延伸"：
                [
                  {
                    "q": "題目敘述",
                    "options": ["選項0", "選項1", "選項2", "選項3"],
                    "answer": 0,
                    "explanation": "一句話解析",
                    "source": "課本"
                  }
                ]`;

        function extendRule(n, gradeName) {
            if (!n) return `\n\n【出題範圍】10 題全部只能根據上述內容出題，不要超出範圍。source 一律填 "課本"。`;
            return `\n\n【出題範圍】
- 約 ${10 - n} 題直接根據課本內容出題（source 填 "課本"）。
- 約 ${n} 題做「微加深加廣」（source 填 "延伸"）：從課本提到的概念往外延伸一小步，例如生活中的實際應用、相關的常見例子、為什麼會這樣的簡單原因。
- 延伸題必須和課本主題直接相關，難度只比課本高一點，${gradeName}年級學生想一想就答得出來，不能需要背冷門知識。
- 延伸題只能使用科學界／學界公認、教科書等級的事實；不確定、有爭議、會隨時間變動的內容（例如最新紀錄、精確統計數字）一律不要出。
- 延伸題的 explanation 要說明它和課本哪個概念有關。`;
        }

        function buildPrompt(src) {
            const { grade, extend } = getQuizSettings();
            const gradeName = GRADE_NAMES[grade];
            const audience = `台灣國小${gradeName}年級學生`;
            const quality = `\n\n【品質要求】
- 用繁體中文、台灣用語，題目與選項的用字要符合${gradeName}年級程度，題目敘述盡量簡短。
- 每題只有一個正確答案，三個錯誤選項要「看起來合理但明確是錯的」，不可以有兩個都算對的選項。
- 避免「以上皆是」「以上皆非」，也避免否定句考法（例如「下列何者不是」）。`;
            const avoid = previousQs.length
                ? `\n\n以下題目已經出過，請出完全不同的新題目，不要換句話說重複出：\n${previousQs.slice(-40).map(q => '- ' + q).join('\n')}`
                : '';
            if (src.type === 'pdf') {
                return `請根據以下教材內文，為${audience}出 10 道四選一選擇題，題目要涵蓋教材不同段落。\n\n【教材內文】\n${src.text}${extendRule(extend, gradeName)}${quality}${avoid}\n\n${JSON_FORMAT}`;
            }
            return `請針對主題「${src.topic}」，為${audience}設計 10 道全新且不重複的四選一單選題。難度要符合${gradeName}年級，可以適度生活化、有趣一點。source 一律填 "課本"。${quality}${avoid}\n\n${JSON_FORMAT}`;
        }

        // ===== 答案檢查：請 AI 當審題老師，獨立重做一遍 =====
        async function verifyQuestions(questions) {
            const { grade } = getQuizSettings();
            const list = questions.map((q, i) => ({ id: i, q: q.q, options: q.options }));
            const prompt = `你是嚴謹的國小${GRADE_NAMES[grade]}年級審題老師。請獨立作答下列四選一題目（不要猜出題者的意思，依照公認正確的知識判斷），並檢查每題品質。
對每一題回報：
- best：你認為唯一正確的選項索引（0~3）
- ok：true 代表這題事實正確、只有一個正確答案、沒有爭議；只要有任何疑慮（事實可能錯誤、兩個選項都對、題意不清、超出${GRADE_NAMES[grade]}年級太多）就填 false

題目：
${JSON.stringify(list)}

請嚴格以 JSON 格式輸出：{"results":[{"id":0,"best":1,"ok":true}]}`;
            const raw = await callGeminiRaw(prompt);
            const parsed = parseJsonLoose(raw);
            const results = (Array.isArray(parsed) ? parsed : (parsed.results || []))
                .filter(r => r && r.id !== undefined && r.best !== undefined);
            // 審題結果格式不對：視為檢查失敗，交給外層保留原題
            if (results.length < questions.length / 2) throw new Error('審題結果格式不符');
            const byId = new Map(results.map(r => [Number(r.id), r]));
            const kept = questions.filter((q, i) => {
                const r = byId.get(i);
                return r && r.ok === true && Number(r.best) === q.answer;
            });
            return { kept, removed: questions.length - kept.length };
        }

        async function generateFromSource(src, isRegen) {
            const label = src.type === 'pdf' ? `教冊「${src.name}」` : `主題「${src.topic}」`;
            showLoading(isRegen ? `AI 正在用${label}重新出題...` : `AI 正在根據${label}出題...`, "請稍候，約 10～30 秒");
            const t0 = Date.now();
            const ticker = setInterval(() => {
                const sec = Math.round((Date.now() - t0) / 1000);
                const base = document.getElementById('overlayDesc').innerText.split('（已等待')[0];
                document.getElementById('overlayDesc').innerText = `${base}（已等待 ${sec} 秒）`;
            }, 1000);
            try {
                let finalQs = [];
                let removedTotal = 0;
                let verifyFailed = false;

                // 最多出兩輪：第一輪被剔除太多題時，補出一輪湊滿
                for (let round = 0; round < 2 && finalQs.length < 8; round++) {
                    const titleEl = document.getElementById('overlayTitle');
                    titleEl.innerText = round === 0
                        ? (isRegen ? `AI 正在用${label}重新出題...` : `AI 正在根據${label}出題...`)
                        : `有幾題不夠可靠，AI 正在補題...`;

                    const generated = await callGeminiAI(buildPrompt(src));
                    previousQs.push(...generated.map(q => q.q));

                    titleEl.innerText = "AI 審題老師正在逐題檢查答案...";
                    try {
                        const { kept, removed } = await verifyQuestions(generated);
                        finalQs.push(...kept);
                        removedTotal += removed;
                    } catch (e) {
                        // 檢查這一步失敗就保留原題，不讓整個出題卡住
                        console.warn('答案檢查失敗', e);
                        verifyFailed = true;
                        finalQs.push(...generated);
                        break;
                    }
                }

                finalQs = finalQs.slice(0, 10);
                clearInterval(ticker);
                if (finalQs.length === 0) throw new Error("出的題目都沒通過答案檢查，請再按一次重新出題。");

                lastSource = src;
                currentQuestions = finalQs;
                document.getElementById('topicTag').innerText = src.type === 'pdf' ? `來源教冊：${src.name}` : `主題：${src.topic}`;
                const extCount = finalQs.filter(q => q.source === '延伸').length;
                const note = verifyFailed
                    ? '（這次答案檢查沒跑成功，題目未經複查）'
                    : (removedTotal ? `，已剔除 ${removedTotal} 題有疑慮的題目` : '，全部通過答案檢查');
                showSuccessPrompt(
                    isRegen ? `${label}新題目已生成！` : `${label}出題完成！`,
                    `共 ${finalQs.length} 題${extCount ? `（含 ${extCount} 題延伸題）` : ''}${note}`
                );
            } catch (err) {
                clearInterval(ticker);
                alert("出題失敗：" + err.message);
                openMenuModal();
            }
        }

        function withTimeout(promise, ms, label) {

        // 字數超過上限時，每頁平均取一段，讓 AI 看到整本書而不是只有前幾頁
        function sampleEvenly(pageTexts, limit) {
            const cleaned = pageTexts.map(t => t.replace(/\s+/g, ' ').trim()).filter(t => t.length > 0);
            const total = cleaned.reduce((n, t) => n + t.length, 0);
            if (total <= limit) return cleaned.join('\n');
            const perPage = Math.max(80, Math.floor(limit / cleaned.length));
            return cleaned.map(t => t.slice(0, perPage)).join('\n').slice(0, limit);
        }

        async function handleFileUpload(event) {
            saveApiKeyFromModal();
            const file = event.target.files[0];
            if (!file) return;

            showLoading("正在解析教冊檔案...", "準備開始提取內文文字");

            let textContent = "";
            try {
                if (file.name.toLowerCase().endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
                    const pdf = await withTimeout(pdfjsLib.getDocument({
                        data: arrayBuffer,
                        cMapUrl: PDFJS_BASE + 'cmaps/',          // 中文字型對照表，教冊 PDF 必備
                        cMapPacked: true,
                        standardFontDataUrl: PDFJS_BASE + 'standard_fonts/'
                    }).promise, 30000, '開啟 PDF');

                    const pageTexts = [];
                    let skipped = 0;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        showLoading(`正在讀取教冊內文 (${i}/${pdf.numPages} 頁)...`, skipped ? `已略過 ${skipped} 頁讀不出來的頁面` : "這可能需要幾秒鐘");
                        try {
                            // 單頁最多等 8 秒，讀不出來就跳過，不讓整份卡住
                            const page = await withTimeout(pdf.getPage(i), 8000, `第 ${i} 頁`);
                            const content = await withTimeout(page.getTextContent(), 8000, `第 ${i} 頁`);
                            pageTexts.push(content.items.map(item => item.str).join(" "));
                            page.cleanup();
                        } catch (e) {
                            skipped++;
                            console.warn('略過頁面', i, e);
                        }
                    }
                    textContent = sampleEvenly(pageTexts, 15000);
                } else {
                    textContent = (await file.text()).slice(0, 15000);
                }

                if (textContent.replace(/\s/g, '').length < 50) {
                    throw new Error("這份 PDF 讀不到文字（可能是掃描成圖片的檔案），請改用有文字層的 PDF 或 .txt。");
                }

                showLoading("教冊讀取完成！", `共取得約 ${textContent.replace(/\s/g, '').length} 字，準備交給 AI 出題`);
            } catch (err) {
                alert("讀取檔案失敗：" + err.message);
                openMenuModal();
                return;
            }

            // 換新教材：清空已出過的題目紀錄
            previousQs = [];
            await generateFromSource({ type: 'pdf', name: file.name, text: textContent }, false);
        }

        // 單一模型呼叫：回傳 {ok, status, text, msg, reason}
        async function requestModel(model, promptText) {
            let url, options;
            if (provider === 'gemini') {
                url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                };
            } else {
                url = 'https://api.openai.com/v1/chat/completions';
                options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model,
                        messages: [
                            { role: 'system', content: '你是國小教師的出題助手。只輸出 JSON 物件，格式為 {"questions":[...]}，不要任何其他文字。' },
                            { role: 'user', content: promptText }
                        ],
                        response_format: { type: 'json_object' }
                    })
                };
            }

            // 最多等 60 秒，避免畫面永遠卡在「出題中」
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 60000);
            options.signal = controller.signal;

            let response;
            try {
                response = await fetch(url, options);
            } catch (e) {
                clearTimeout(timer);
                if (e.name === 'AbortError') {
                    return { ok: false, status: 408, msg: `${model} 超過 60 秒沒回應` };
                }
                return { ok: false, status: 0, msg: `網路連不到 ${PROVIDERS[provider].name}（可能被學校網路/防火牆擋住，或目前離線）` };
            }
            clearTimeout(timer);
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
                const text = provider === 'gemini'
                    ? (data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '')
                    : (data.choices?.[0]?.message?.content || '');
                return { ok: true, status: 200, text };
            }
            return {
                ok: false,
                status: response.status,
                msg: data.error?.message || `HTTP ${response.status}`,
                reason: JSON.stringify(data.error || {})
            };
        }

        // 呼叫 API：自動找能用的模型，錯誤訊息翻成看得懂的中文
        async function callGeminiRaw(promptText, retries = 3) {
            const P = PROVIDERS[provider];
            if (!apiKey) throw new Error(`請先在上方框框中輸入或貼上 ${P.name} API Key！`);

            const models = workingModel
                ? [workingModel, ...P.models.filter(m => m !== workingModel)]
                : P.models;

            let lastMsg = '';
            for (const model of models) {
                for (let i = 0; i < retries; i++) {
                    const res = await requestModel(model, promptText);

                    if (res.ok) {
                        workingModel = model;
                        localStorage.setItem(`${provider}_working_model`, model);
                        if (!res.text) throw new Error("AI 沒有回傳內容（可能被安全過濾擋下），請換個主題或教材再試。");
                        return res.text;
                    }

                    lastMsg = res.msg;
                    const detail = (res.reason || '') + res.msg;

                    // Key 問題：不必重試、不必換模型
                    if ((res.status === 400 && /API_KEY_INVALID|API key not valid/i.test(detail)) || res.status === 401) {
                        throw new Error(`API Key 無效：請重新複製完整的 ${P.name} Key（${P.keyHint}）。`);
                    }
                    if (res.status === 403) {
                        throw new Error("這把 API Key 沒有權限（可能被停用、限制了網域，或專案未開通）。原始訊息：" + res.msg);
                    }
                    if (res.status === 0) throw new Error(res.msg);

                    // GPT 帳戶沒錢：重試也沒用
                    if (res.status === 429 && /insufficient_quota|billing/i.test(detail)) {
                        throw new Error("OpenAI 帳戶餘額不足：請到 platform.openai.com 的 Billing 儲值後再試。");
                    }

                    // 模型不存在 / 已下架 / 帳號等級還用不到：換下一個模型
                    if (res.status === 404 || /model_not_found|does not exist|do not have access/i.test(detail)) break;

                    // 超時：不重試同一個模型，直接換下一個
                    if (res.status === 408) {
                        showLoadingIfOpen("這個模型太慢了，換一個試試...", `改用下一個模型`);
                        break;
                    }

                    // 額度用完：等一下再試，最後一次就換模型
                    if (res.status === 429) {
                        if (i < retries - 1) {
                            showLoadingIfOpen("免費額度暫時用完，等待中...", `自動重試 (${i + 1}/${retries - 1})`);
                            await new Promise(r => setTimeout(r, 5000 * (i + 1)));
                            continue;
                        }
                        break;
                    }

                    // 500/503 伺服器忙碌：重試
                    if (i < retries - 1) {
                        showLoadingIfOpen("伺服器忙碌中...", `自動重試 (${i + 1}/${retries - 1})`);
                        await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                        continue;
                    }
                    break;
                }
            }
            throw new Error("所有模型都連線失敗。最後的錯誤訊息：" + lastMsg);
        }

        async function callGeminiAI(promptText) {
            const raw = await callGeminiRaw(promptText);
            return normalizeQuestions(parseJsonLoose(raw));
        }

        // 容錯解析：去掉 ```json 包裝、支援 {questions:[...]} 外層
        function parseJsonLoose(text) {
            let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
            try { return JSON.parse(t); } catch (e) {}
            const start = t.indexOf('['), end = t.lastIndexOf(']');
            if (start !== -1 && end > start) {
                try { return JSON.parse(t.slice(start, end + 1)); } catch (e) {}
            }
            throw new Error("AI 回傳的格式無法解析，請再按一次試試。");
        }

        function normalizeQuestions(parsed) {
            let arr = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.items || Object.values(parsed).find(Array.isArray));
            if (!Array.isArray(arr)) throw new Error("AI 回傳的不是題目清單，請再試一次。");
            arr = arr.filter(q =>
                q && typeof q.q === 'string' &&
                Array.isArray(q.options) && q.options.length === 4 &&
                Number.isInteger(Number(q.answer)) && Number(q.answer) >= 0 && Number(q.answer) <= 3
            ).map(q => ({ ...q, answer: Number(q.answer) }));
            if (arr.length === 0) throw new Error("生成的題目格式都不完整，請再試一次。");
            return arr;
        }

                const mark = document.createElement('span');
                mark.className = 'mark text-[10px] bg-slate-700 px-2 py-0.5 rounded font-mono';
                mark.innerText = keys[i];
                btn.appendChild(label);
                btn.appendChild(mark);
                btn.onclick = () => handleAnswer(team, i);
                container.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            questionStartTime = performance.now();
            timeLeft = QUESTION_TIME;
            const timerEl = document.getElementById('timer');
            timerEl.innerText = timeLeft;
            timerEl.classList.remove('text-red-500');

            timerInterval = setInterval(() => {
                const elapsed = (performance.now() - questionStartTime) / 1000;
                timeLeft = Math.max(0, Math.ceil(QUESTION_TIME - elapsed));
                timerEl.innerText = timeLeft;
                timerEl.classList.toggle('text-red-500', timeLeft <= 5);
                if (elapsed >= QUESTION_TIME) {
                    clearInterval(timerInterval);
                    revealAnswer();
                }
            }, 200);
        }

        // 越快答對拉越多：剩餘時間比例 × (最大 - 最小) + 最小
        function calcPull() {
            const elapsed = (performance.now() - questionStartTime) / 1000;
            const ratio = Math.max(0, 1 - elapsed / QUESTION_TIME);
            return Math.round(MIN_PULL + (MAX_PULL - MIN_PULL) * ratio);
        }

        function handleAnswer(team, optionIdx) {
            if (!isQuestionActive) return;
            if ((team === 'left' && leftAnswered) || (team === 'right' && rightAnswered)) return;

            const qData = currentQuestions[currentQuestionIdx];
            const isCorrect = (optionIdx === qData.answer);
            const containerId = team === 'left' ? 'leftOptions' : 'rightOptions';
            const panel = document.getElementById(team === 'left' ? 'leftPanel' : 'rightPanel');

            if (team === 'left') leftAnswered = true; else rightAnswered = true;
            disableOptionGroup(containerId);

            const btns = document.querySelectorAll(`#${containerId} button`);
            const picked = btns[optionIdx];

            if (isCorrect) {
                const pull = calcPull();
                ropePosition += team === 'left' ? -pull : pull;
                stats[team].correct++;
                stats[team].pull += pull;
                picked.classList.add('opt-correct');
                picked.querySelector('.mark').innerText = '✔ 答對';
                panel.classList.add('panel-flash-ok');
                showPop(team, `✔ +${pull}`, '#4ade80');
            } else {
                stats[team].wrong++;
                picked.classList.add('opt-wrong', 'shake');
                picked.querySelector('.mark').innerText = '✘ 答錯';
                panel.classList.add('panel-flash-bad');
                showPop(team, '✘ 不動', '#f87171');
            }
            // 其他選項變暗，讓選到的更明顯
            btns.forEach((b, i) => { if (i !== optionIdx) b.classList.add('opt-dim'); });

            updateRopeUI();
            updateScoreBoard();

            if (leftAnswered && rightAnswered) revealAnswer();
        }

        function showPop(team, text, color) {
            const el = document.getElementById(team === 'left' ? 'leftPop' : 'rightPop');
            el.innerText = text;
            el.style.color = color;
            el.classList.remove('pop');
            void el.offsetWidth; // 重新觸發動畫
            el.classList.add('pop');
        }

        // 公布答案：標出正確選項、顯示解析，2.5 秒後下一題
        function revealAnswer() {
            if (!isQuestionActive) return;
            isQuestionActive = false;
            clearInterval(timerInterval);

            const qData = currentQuestions[currentQuestionIdx];
            ['left', 'right'].forEach(team => {
                const answered = team === 'left' ? leftAnswered : rightAnswered;
                if (!answered) {
                    stats[team].none++;
                    showPop(team, '⏰ 沒作答', '#94a3b8');
                }
                const btns = document.querySelectorAll(`#${team === 'left' ? 'leftOptions' : 'rightOptions'} button`);
                btns.forEach(b => b.disabled = true);
                const correctBtn = btns[qData.answer];
                if (correctBtn && !correctBtn.classList.contains('opt-correct')) {
                    correctBtn.classList.remove('opt-dim');
                    correctBtn.classList.add('opt-reveal');
                    correctBtn.querySelector('.mark').innerText = '正解';
                }
            });

            const exp = document.getElementById('explainText');
            exp.innerText = `✅ 正解：${qData.options[qData.answer]}${qData.explanation ? '　｜　' + qData.explanation : ''}`;
            exp.classList.remove('hidden');

            revealTimeout = setTimeout(nextQuestion, 2500);
        }

        function disableOptionGroup(containerId) {
            document.querySelectorAll(`#${containerId} button`).forEach(btn => btn.disabled = true);
        }

        function updateRopeUI() {
            ropePosition = Math.max(-ROPE_LIMIT, Math.min(ROPE_LIMIT, ropePosition));
            document.getElementById('ropeContainer').style.transform = `translateX(${ropePosition}px)`;
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            clearTimeout(revealTimeout);
            if (currentQuestionIdx + 1 < currentQuestions.length) {
                loadQuestion(currentQuestionIdx + 1);
            } else {
                endGame();
            }
        }

        function teamCard(name, s, color, total, isWinner) {
            const rate = total ? Math.round(s.correct / total * 100) : 0;
            return `
                <div class="rounded-xl p-3 border-2 ${color === 'red' ? 'border-red-500 bg-red-950/50' : 'border-blue-500 bg-blue-950/50'} ${isWinner ? 'ring-4 ring-amber-400' : ''}">
                    <div class="font-black text-base ${color === 'red' ? 'text-red-300' : 'text-blue-300'} mb-2">${isWinner ? '🏆 ' : ''}${name}</div>
                    <div class="text-sm space-y-1 font-bold">
                        <div class="flex justify-between"><span class="text-green-400">✔ 答對</span><span class="text-green-400 text-lg">${s.correct} 題</span></div>
                        <div class="flex justify-between"><span class="text-red-400">✘ 答錯</span><span class="text-red-400 text-lg">${s.wrong} 題</span></div>
                        <div class="flex justify-between text-slate-400"><span>⏰ 沒作答</span><span>${s.none} 題</span></div>
                        <div class="flex justify-between text-amber-300 border-t border-slate-600 pt-1 mt-1"><span>答對率</span><span>${rate}%</span></div>
                        <div class="flex justify-between text-slate-300"><span>總拉力</span><span>${s.pull}</span></div>
                    </div>
                </div>`;
        }

        function endGame() {
            pauseGame();
            const total = currentQuestions.length;
            // 勝負看總拉力（答對又答得快的贏）
            let winnerText = "🤝 雙方勢均力敵，打成平手！";
            let winner = null;
            if (stats.left.pull > stats.right.pull) { winner = 'left'; winnerText = "🔴 恭喜【紅隊】獲得最終勝利！"; }
            else if (stats.right.pull > stats.left.pull) { winner = 'right'; winnerText = "🔵 恭喜【藍隊】獲得最終勝利！"; }

            document.getElementById('resultArea').innerHTML =
                teamCard('紅隊', stats.left, 'red', total, winner === 'left') +
                teamCard('藍隊', stats.right, 'blue', total, winner === 'right');

            document.getElementById('overlayTitle').innerText = "比賽結束！";
            document.getElementById('overlayDesc').innerText = winnerText;
            document.getElementById('overlayDesc').className = "text-amber-300 text-base font-black mt-1";
            document.getElementById('actionBtnArea').style.display = "block";
            document.getElementById('overlayBtn').innerText = "🔁 同樣題目再玩一次 (Enter)";
            setOverlayParts({ setup: false, result: true, regen: true, back: true });
            document.getElementById('overlay').classList.remove('hidden');
        }

        document.addEventListener('keydown', (e) => {
            // 在輸入框打字時不觸發遊戲按鍵
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

            if (e.key === 'Enter') {
                const overlay = document.getElementById('overlay');
                if (!overlay.classList.contains('hidden') && document.getElementById('actionBtnArea').style.display !== 'none') {
                    e.preventDefault();
                    startGame();
                    return;
                }
            }

            if (!isQuestionActive) return;
            const k = e.key.toUpperCase();
            if (['Q','W','E','R'].includes(k)) handleAnswer('left', ['Q','W','E','R'].indexOf(k));
            else if (['U','I','O','P'].includes(k)) handleAnswer('right', ['U','I','O','P'].indexOf(k));
        });

        function resetDescStyle() {
            document.getElementById('overlayDesc').className = "text-slate-300 text-xs mt-1";
        }

        function showLoading(title, desc) {
            pauseGame();
            resetDescStyle();
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('actionBtnArea').style.display = "none";
            setOverlayParts({ setup: false, result: false, regen: false, back: false });
            document.getElementById('overlay').classList.remove('hidden');
        }

        function showSuccessPrompt(title, desc) {
            resetDescStyle();
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('actionBtnArea').style.display = "block";
            document.getElementById('overlayBtn').innerText = "🚀 立即開始比賽 (Enter)";
            setOverlayParts({ setup: false, result: false, regen: true, back: true });
            document.getElementById('overlay').classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
