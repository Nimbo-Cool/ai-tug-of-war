<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧雙人拔河大對決</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; user-select: none; }
        .rope-transition { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- 上方控制區與標題 -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🪢</span>
                <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-red-400 via-amber-300 to-blue-400">
                    AI 智慧雙人拔河大對決
                </h1>
            </div>

            <!-- 切換選單按鈕 -->
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="openMenuModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-gear"></i> 設定 API / 切換題庫
                </button>
            </div>
        </div>
    </header>

    <!-- 遊戲主舞台 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col justify-between relative">
        
        <!-- 拔河比分與進度條 -->
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 mb-4 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-2">
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded-full bg-red-500 inline-block animate-ping"></span>
                    <span class="font-bold text-red-400 text-lg">紅隊（左邊）</span>
                </div>
                <div class="text-center">
                    <span id="questionProgress" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-mono">第 1 / 10 題</span>
                    <div id="timer" class="text-2xl font-black text-amber-400 mt-1">15</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-blue-400 text-lg">藍隊（右邊）</span>
                    <span class="w-4 h-4 rounded-full bg-blue-500 inline-block animate-ping"></span>
                </div>
            </div>

            <!-- 拔河賽道 -->
            <div class="relative h-20 bg-slate-900 rounded-xl overflow-hidden border-2 border-slate-700 flex items-center justify-center">
                <div class="absolute inset-y-0 w-1 bg-amber-400 z-10 left-1/2 -translate-x-1/2 opacity-70"></div>
                <div class="absolute top-1 left-1/2 -translate-x-1/2 text-[10px] text-amber-400 font-mono z-10">勝負中線</div>

                <!-- 繩子與人物容器 -->
                <div id="ropeContainer" class="absolute w-full flex items-center justify-center rope-transition" style="transform: translateX(0px);">
                    <div class="flex items-center gap-1 mr-[-10px]">
                        <span class="text-4xl transform -scale-x-100">🤼</span>
                        <span class="text-3xl transform -scale-x-100">🧒</span>
                    </div>
                    <div class="w-2/3 h-4 bg-amber-700 border-y-2 border-amber-900 relative flex items-center justify-center shadow-inner">
                        <div class="w-6 h-8 bg-red-600 rounded-sm shadow-md animate-bounce"></div>
                    </div>
                    <div class="flex items-center gap-1 ml-[-10px]">
                        <span class="text-3xl">🧒</span>
                        <span class="text-4xl">🤼</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 題目顯示區 -->
        <div class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700 shadow-2xl min-h-[140px] flex flex-col justify-center items-center text-center my-2 relative">
            <div id="topicTag" class="absolute top-3 left-4 text-xs font-bold text-indigo-400 bg-indigo-950/80 border border-indigo-800 px-2.5 py-1 rounded-md">
                題庫：預設基礎題庫
            </div>
            <h2 id="questionText" class="text-xl md:text-2xl font-bold leading-relaxed text-slate-100 mt-4">
                請在設定選單中選擇或上傳題庫開始比賽！
            </h2>
        </div>

        <!-- 雙人搶答選項區（左隊 vs 右隊） -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-2">
            <!-- 紅隊選項區 -->
            <div class="bg-red-950/30 border-2 border-red-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2">
                <div class="text-xs font-bold text-red-400 flex justify-between items-center mb-1">
                    <span>🔴 紅隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：Q, W, E, R</span>
                </div>
                <div id="leftOptions" class="grid grid-cols-1 gap-2"></div>
            </div>

            <!-- 藍隊選項區 -->
            <div class="bg-blue-950/30 border-2 border-blue-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2">
                <div class="text-xs font-bold text-blue-400 flex justify-between items-center mb-1">
                    <span>🔵 藍隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：U, I, O, P</span>
                </div>
                <div id="rightOptions" class="grid grid-cols-1 gap-2"></div>
            </div>
        </div>

    </main>

    <!-- 啟動 Modal 視窗 -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-4 text-center overflow-y-auto">
        <div id="overlayContent" class="max-w-md w-full bg-slate-800 p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl space-y-5 my-auto">
            <div>
                <div class="text-5xl mb-2">🪢</div>
                <h3 id="overlayTitle" class="text-2xl font-black text-amber-400">AI 智慧拔河大對決</h3>
                <p id="overlayDesc" class="text-slate-300 text-xs mt-1">設定 API Key 與題庫開始遊戲：</p>
            </div>

            <!-- 1. AI 來源切換 + API Key 輸入框（自動記憶於瀏覽器） -->
            <div class="bg-slate-900/80 border border-amber-500/40 p-4 rounded-xl text-left space-y-2">
                <div class="grid grid-cols-2 gap-2 mb-1">
                    <button type="button" id="btnGemini" onclick="switchProvider('gemini')" class="py-2 rounded-lg text-xs font-bold transition border">
                        ✨ Gemini（免費）
                    </button>
                    <button type="button" id="btnOpenAI" onclick="switchProvider('openai')" class="py-2 rounded-lg text-xs font-bold transition border">
                        🤖 GPT（需儲值）
                    </button>
                </div>
                <label class="block text-xs font-bold text-amber-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-amber-400"></i> <span id="keyLabel">Gemini API Key 設定：</span>
                </label>
                <div class="relative">
                    <input type="password" id="apiKeyInputModal" onchange="saveApiKeyFromModal()" placeholder="請貼上您的 Gemini API Key..." 
                        class="w-full bg-slate-800 border border-slate-600 focus:border-amber-400 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none transition pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white text-xs">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="flex items-center justify-between gap-2">
                    <p class="text-[11px] text-slate-400">輕點輸入框外即可自動儲存。金鑰僅儲存於個人瀏覽器。</p>
                    <button type="button" onclick="testConnection()" class="shrink-0 px-2.5 py-1 bg-amber-600 hover:bg-amber-500 rounded-md text-[11px] font-bold transition">
                        <i class="fa-solid fa-plug"></i> 測試連線
                    </button>
                </div>
                <p id="connStatus" class="text-[11px] font-bold hidden"></p>
            </div>

            <!-- 2. 核心功能：上傳教冊 PDF -->
            <div class="bg-indigo-950/50 border-2 border-indigo-500 hover:border-indigo-400 p-5 rounded-2xl text-left transition shadow-lg">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-xl font-bold">
                        📄
                    </div>
                    <div>
                        <h4 class="font-bold text-indigo-200 text-base">匯入教師手冊 / 課本檔</h4>
                        <p class="text-xs text-slate-300">上傳教冊 PDF，AI 將直接從全書內容出題</p>
                    </div>
                </div>
                <label class="mt-3 w-full py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white text-center font-extrabold text-sm rounded-xl cursor-pointer block transition shadow-md">
                    <i class="fa-solid fa-file-pdf mr-1.5"></i> 選擇並上傳教冊 PDF
                    <input type="file" id="pdfInputModal" accept=".pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>

            <!-- 3. 次要功能：選擇主題 AI 出題 -->
            <div class="bg-slate-700/50 border border-slate-600 p-4 rounded-xl text-left">
                <label class="block text-xs font-bold text-amber-300 mb-2">✨ 或挑選預設 AI 主題生成題目：</label>
                <select id="topicSelectModal" onchange="generateQuestionsByTopic(this.value)" class="w-full bg-slate-800 border border-slate-600 p-2.5 rounded-lg text-xs font-bold text-slate-100 cursor-pointer focus:outline-none focus:border-amber-400">
                    <option value="" disabled selected>-- 點擊選擇主題（每次出題不同） --</option>
                    <option value="自然科學小常識">🌱 自然科學小常識</option>
                    <option value="成語典故與成語接龍">📚 成語典故與活用</option>
                    <option value="台灣歷史與地理人文">🗺️ 台灣歷史與地理</option>
                    <option value="日常生活生活常識與安全">💡 日常生活與安全常識</option>
                    <option value="國小基礎英文單字與文法">🔤 基礎英文單字與語感</option>
                    <option value="趣味數學邏輯推理">🔢 趣味數學與邏輯腦筋急轉彎</option>
                </select>
            </div>

            <!-- 4. 預設按鈕區 -->
            <div id="actionBtnArea" class="pt-1">
                <button id="overlayBtn" onclick="startGame()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold rounded-xl text-sm transition">
                    🚀 直接使用預設題目開始遊戲
                </button>
            </div>
        </div>
    </div>

    <script>
        // ===== AI 來源設定 =====
        const PROVIDERS = {
            gemini: {
                name: 'Gemini',
                // 第一個是 Google 官方「自動指向最新 Flash」的別名，舊模型下架也不用改程式
                models: ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-flash-lite-latest'],
                placeholder: '請貼上您的 Gemini API Key（AIza 開頭）...',
                keyHint: 'AIza 開頭'
            },
            openai: {
                name: 'GPT',
                // 便宜又快的 mini 等級，失敗時自動往下換
                models: ['gpt-5.4-mini', 'gpt-mini-latest', 'gpt-5-mini'],
                placeholder: '請貼上您的 OpenAI API Key（sk- 開頭）...',
                keyHint: 'sk- 開頭'
            }
        };

        let provider = localStorage.getItem('ai_provider') || 'gemini';
        let apiKey = localStorage.getItem(`${provider}_api_key`) || '';
        let workingModel = localStorage.getItem(`${provider}_working_model`) || '';

        function switchProvider(p) {
            saveApiKeyFromModal();
            provider = p;
            localStorage.setItem('ai_provider', p);
            apiKey = localStorage.getItem(`${p}_api_key`) || '';
            workingModel = localStorage.getItem(`${p}_working_model`) || '';
            renderProviderUI();
        }

        function renderProviderUI() {
            const on = 'bg-amber-500 border-amber-400 text-slate-900';
            const off = 'bg-slate-800 border-slate-600 text-slate-300 hover:bg-slate-700';
            document.getElementById('btnGemini').className = `py-2 rounded-lg text-xs font-bold transition border ${provider === 'gemini' ? on : off}`;
            document.getElementById('btnOpenAI').className = `py-2 rounded-lg text-xs font-bold transition border ${provider === 'openai' ? on : off}`;
            document.getElementById('keyLabel').innerText = `${PROVIDERS[provider].name} API Key 設定：`;
            const input = document.getElementById('apiKeyInputModal');
            input.placeholder = PROVIDERS[provider].placeholder;
            input.value = apiKey;
            document.getElementById('connStatus').classList.add('hidden');
        }

        let currentQuestions = [];
        let currentQuestionIdx = 0;
        let ropePosition = 0;
        let timerInterval = null;
        let timeLeft = 15;
        let isQuestionActive = false;
        let leftAnswered = false;
        let rightAnswered = false;

        const defaultQuestions = [
            { q: "下列哪一種動物屬於哺乳類動物？", options: ["企鵝", "海豚", "鱷魚", "綠蠵龜"], answer: 1, explanation: "海豚用肺呼吸且胎生哺乳，屬於哺乳類。" },
            { q: "植物進行光合作用時，主要吸收哪種氣體？", options: ["氧氣", "二氧化碳", "氮氣", "氫氣"], answer: 1, explanation: "植物吸收二氧化碳與水，利用陽光製造養分與氧氣。" },
            { q: "地球繞太陽公轉一圈大約需要多久時間？", options: ["1 天", "1 個月", "1 年", "10 年"], answer: 2, explanation: "地球公轉一圈約為 365 天（一年）。" },
            { q: "水在常壓下加熱到幾度會沸騰變成水蒸氣？", options: ["50℃", "80℃", "100℃", "200℃"], answer: 2, explanation: "水的標準沸點為 100 攝氏度。" },
            { q: "「百折不撓」這個成語常用來形容什麼樣的精神？", options: ["意志堅定不屈", "辦事效率極高", "性格十分隨和", "學習速度飛快"], answer: 0, explanation: "百折不撓指遭受挫折仍不屈服。" }
        ];

        window.onload = function() {
            currentQuestions = [...defaultQuestions];
            renderProviderUI();
            openMenuModal();
        };

        function saveApiKeyFromModal() {
            // 去掉空白、換行、誤貼的引號
            const inputVal = document.getElementById('apiKeyInputModal').value.replace(/[\s"'「」]/g, '');
            document.getElementById('apiKeyInputModal').value = inputVal;
            if (inputVal !== apiKey) {
                workingModel = '';
                localStorage.removeItem(`${provider}_working_model`);
            }
            apiKey = inputVal;
            localStorage.setItem(`${provider}_api_key`, apiKey);
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('apiKeyInputModal');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function setConnStatus(text, ok) {
            const el = document.getElementById('connStatus');
            el.classList.remove('hidden', 'text-green-400', 'text-red-400', 'text-slate-300');
            el.classList.add(ok === true ? 'text-green-400' : ok === false ? 'text-red-400' : 'text-slate-300');
            el.innerText = text;
        }

        async function testConnection() {
            saveApiKeyFromModal();
            setConnStatus('連線測試中...', null);
            try {
                await callGeminiRaw('請只回覆 JSON：{"ok":true}', 1);
                setConnStatus(`✅ 連線成功（使用模型：${workingModel}）`, true);
            } catch (err) {
                setConnStatus('❌ ' + err.message, false);
            }
        }

        function openMenuModal() {
            document.getElementById('overlayTitle').innerText = "AI 智慧拔河大對決";
            document.getElementById('overlayDesc').innerText = "設定 API Key 與題庫開始遊戲：";
            document.getElementById('actionBtnArea').style.display = "block";
            document.getElementById('overlayBtn').innerText = "🚀 直接使用目前題目開始遊戲";
            document.getElementById('topicSelectModal').selectedIndex = 0;
            document.getElementById('pdfInputModal').value = '';
            document.getElementById('overlay').classList.remove('hidden');
        }

        async function handleFileUpload(event) {
            saveApiKeyFromModal();
            const file = event.target.files[0];
            if (!file) return;

            showLoading("正在解析教冊檔案...", "準備開始提取內文文字");

            try {
                let textContent = "";
                if (file.name.toLowerCase().endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        showLoading(`正在讀取教冊內文 (${i}/${pdf.numPages} 頁)...`, "這可能需要幾秒鐘");
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        textContent += content.items.map(item => item.str).join(" ") + "\n";
                    }
                } else {
                    textContent = await file.text();
                }

                if (textContent.replace(/\s/g, '').length < 50) {
                    throw new Error("這份 PDF 讀不到文字（可能是掃描成圖片的檔案），請改用有文字層的 PDF 或 .txt。");
                }

                textContent = textContent.slice(0, 15000);

                showLoading("AI 正在閱讀全書重點並出題中...", "自動為您生成 10 道選擇題");

                const prompt = `請根據以下教材內文，用繁體中文出 10 道適合國小學生的四選一選擇題：\n\n${textContent}\n\n
                請嚴格以 JSON 格式輸出陣列，answer 為正確選項的索引（0~3）：
                [
                  {
                    "q": "問題敘述",
                    "options": ["選項0", "選項1", "選項2", "選項3"],
                    "answer": 0,
                    "explanation": "解析"
                  }
                ]`;

                const generated = await callGeminiAI(prompt);
                currentQuestions = generated;
                document.getElementById('topicTag').innerText = `來源教冊：${file.name}`;
                showSuccessPrompt(`教冊「${file.name}」匯入成功！`, `AI 已針對本書生成 ${generated.length} 題測驗！`);
            } catch (err) {
                alert("出題失敗：" + err.message);
                openMenuModal();
            }
        }

        async function generateQuestionsByTopic(topic) {
            saveApiKeyFromModal();
            if (!topic) return;

            showLoading(`AI 正在生成「${topic}」題目...`, "請稍候，AI 正在現場創作全新 10 題");

            const prompt = `請針對主題「${topic}」，用繁體中文為國小學生設計 10 道全新且不重複的四選一單選題。
            請嚴格以 JSON 格式輸出陣列，answer 為正確選項的索引（0~3）：
            [
              {
                "q": "題目敘述",
                "options": ["選項0", "選項1", "選項2", "選項3"],
                "answer": 0,
                "explanation": "解析"
              }
            ]`;

            try {
                const generated = await callGeminiAI(prompt);
                currentQuestions = generated;
                document.getElementById('topicTag').innerText = `主題：${topic}`;
                showSuccessPrompt(`主題「${topic}」題目已生成！`, `已成功生成 ${generated.length} 道全新題目！`);
            } catch (err) {
                alert("出題失敗：" + err.message);
                openMenuModal();
            }
        }

        // 單一模型呼叫：回傳 {ok, status, text, msg, reason}
        async function requestModel(model, promptText) {
            let url, options;
            if (provider === 'gemini') {
                url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
                options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                };
            } else {
                url = 'https://api.openai.com/v1/chat/completions';
                options = {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model,
                        messages: [
                            { role: 'system', content: '你是國小教師的出題助手。只輸出 JSON 物件，格式為 {"questions":[...]}，不要任何其他文字。' },
                            { role: 'user', content: promptText }
                        ],
                        response_format: { type: 'json_object' }
                    })
                };
            }

            let response;
            try {
                response = await fetch(url, options);
            } catch (e) {
                return { ok: false, status: 0, msg: `網路連不到 ${PROVIDERS[provider].name}（可能被學校網路/防火牆擋住，或目前離線）` };
            }
            const data = await response.json().catch(() => ({}));
            if (response.ok) {
                const text = provider === 'gemini'
                    ? (data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '')
                    : (data.choices?.[0]?.message?.content || '');
                return { ok: true, status: 200, text };
            }
            return {
                ok: false,
                status: response.status,
                msg: data.error?.message || `HTTP ${response.status}`,
                reason: JSON.stringify(data.error || {})
            };
        }

        // 呼叫 API：自動找能用的模型，錯誤訊息翻成看得懂的中文
        async function callGeminiRaw(promptText, retries = 3) {
            const P = PROVIDERS[provider];
            if (!apiKey) throw new Error(`請先在上方框框中輸入或貼上 ${P.name} API Key！`);

            const models = workingModel
                ? [workingModel, ...P.models.filter(m => m !== workingModel)]
                : P.models;

            let lastMsg = '';
            for (const model of models) {
                for (let i = 0; i < retries; i++) {
                    const res = await requestModel(model, promptText);

                    if (res.ok) {
                        workingModel = model;
                        localStorage.setItem(`${provider}_working_model`, model);
                        if (!res.text) throw new Error("AI 沒有回傳內容（可能被安全過濾擋下），請換個主題或教材再試。");
                        return res.text;
                    }

                    lastMsg = res.msg;
                    const detail = (res.reason || '') + res.msg;

                    // Key 問題：不必重試、不必換模型
                    if ((res.status === 400 && /API_KEY_INVALID|API key not valid/i.test(detail)) || res.status === 401) {
                        throw new Error(`API Key 無效：請重新複製完整的 ${P.name} Key（${P.keyHint}）。`);
                    }
                    if (res.status === 403) {
                        throw new Error("這把 API Key 沒有權限（可能被停用、限制了網域，或專案未開通）。原始訊息：" + res.msg);
                    }
                    if (res.status === 0) throw new Error(res.msg);

                    // GPT 帳戶沒錢：重試也沒用
                    if (res.status === 429 && /insufficient_quota|billing/i.test(detail)) {
                        throw new Error("OpenAI 帳戶餘額不足：請到 platform.openai.com 的 Billing 儲值後再試。");
                    }

                    // 模型不存在 / 已下架 / 帳號等級還用不到：換下一個模型
                    if (res.status === 404 || /model_not_found|does not exist|do not have access/i.test(detail)) break;

                    // 額度用完：等一下再試，最後一次就換模型
                    if (res.status === 429) {
                        if (i < retries - 1) {
                            showLoadingIfOpen("免費額度暫時用完，等待中...", `自動重試 (${i + 1}/${retries - 1})`);
                            await new Promise(r => setTimeout(r, 5000 * (i + 1)));
                            continue;
                        }
                        break;
                    }

                    // 500/503 伺服器忙碌：重試
                    if (i < retries - 1) {
                        showLoadingIfOpen("伺服器忙碌中...", `自動重試 (${i + 1}/${retries - 1})`);
                        await new Promise(r => setTimeout(r, 2000 * (i + 1)));
                        continue;
                    }
                    break;
                }
            }
            throw new Error("所有模型都連線失敗。最後的錯誤訊息：" + lastMsg);
        }

        async function callGeminiAI(promptText) {
            const raw = await callGeminiRaw(promptText);
            return normalizeQuestions(parseJsonLoose(raw));
        }

        // 容錯解析：去掉 ```json 包裝、支援 {questions:[...]} 外層
        function parseJsonLoose(text) {
            let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
            try { return JSON.parse(t); } catch (e) {}
            const start = t.indexOf('['), end = t.lastIndexOf(']');
            if (start !== -1 && end > start) {
                try { return JSON.parse(t.slice(start, end + 1)); } catch (e) {}
            }
            throw new Error("AI 回傳的格式無法解析，請再按一次試試。");
        }

        function normalizeQuestions(parsed) {
            let arr = Array.isArray(parsed) ? parsed : (parsed.questions || parsed.items || Object.values(parsed).find(Array.isArray));
            if (!Array.isArray(arr)) throw new Error("AI 回傳的不是題目清單，請再試一次。");
            arr = arr.filter(q =>
                q && typeof q.q === 'string' &&
                Array.isArray(q.options) && q.options.length === 4 &&
                Number.isInteger(Number(q.answer)) && Number(q.answer) >= 0 && Number(q.answer) <= 3
            ).map(q => ({ ...q, answer: Number(q.answer) }));
            if (arr.length === 0) throw new Error("生成的題目格式都不完整，請再試一次。");
            return arr;
        }

        function showLoadingIfOpen(title, desc) {
            if (!document.getElementById('overlay').classList.contains('hidden') &&
                document.getElementById('actionBtnArea').style.display === 'none') {
                showLoading(title, desc);
            }
        }

        function startGame() {
            saveApiKeyFromModal();
            hideOverlay();
            currentQuestionIdx = 0;
            ropePosition = 0;
            updateRopeUI();
            loadQuestion(0);
        }

        function loadQuestion(idx) {
            if (idx >= currentQuestions.length) {
                endGame();
                return;
            }

            isQuestionActive = true;
            leftAnswered = false;
            rightAnswered = false;
            currentQuestionIdx = idx;

            const qData = currentQuestions[idx];
            document.getElementById('questionProgress').innerText = `第 ${idx + 1} / ${currentQuestions.length} 題`;
            document.getElementById('questionText').innerText = qData.q;

            const keysLeft = ['Q', 'W', 'E', 'R'];
            const keysRight = ['U', 'I', 'O', 'P'];

            renderOptionGroup('leftOptions', qData.options, keysLeft, 'left');
            renderOptionGroup('rightOptions', qData.options, keysRight, 'right');

            startTimer();
        }

        function renderOptionGroup(containerId, options, keys, team) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl border text-sm font-bold flex items-center justify-between transition ${
                    team === 'left' 
                    ? 'bg-slate-800 hover:bg-red-900/40 border-slate-700 hover:border-red-500' 
                    : 'bg-slate-800 hover:bg-blue-900/40 border-slate-700 hover:border-blue-500'
                }`;
                const label = document.createElement('span');
                label.innerHTML = `<b class="text-amber-400 mr-2">${i+1}.</b>`;
                label.appendChild(document.createTextNode(String(opt)));
                const key = document.createElement('span');
                key.className = 'text-[10px] bg-slate-700 px-2 py-0.5 rounded font-mono';
                key.innerText = keys[i];
                btn.appendChild(label);
                btn.appendChild(key);
                btn.onclick = () => handleAnswer(team, i);
                container.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function handleAnswer(team, optionIdx) {
            if (!isQuestionActive) return;

            const qData = currentQuestions[currentQuestionIdx];
            const isCorrect = (optionIdx === qData.answer);

            if (team === 'left' && !leftAnswered) {
                leftAnswered = true;
                disableOptionGroup('leftOptions');
                if (isCorrect) ropePosition -= 20;
            } else if (team === 'right' && !rightAnswered) {
                rightAnswered = true;
                disableOptionGroup('rightOptions');
                if (isCorrect) ropePosition += 20;
            }

            updateRopeUI();

            if (leftAnswered && rightAnswered) {
                isQuestionActive = false;
                clearInterval(timerInterval);
                setTimeout(nextQuestion, 1000);
            }
        }

        function disableOptionGroup(containerId) {
            const btns = document.querySelectorAll(`#${containerId} button`);
            btns.forEach(btn => btn.disabled = true);
        }

        function updateRopeUI() {
            ropePosition = Math.max(-120, Math.min(120, ropePosition));
            document.getElementById('ropeContainer').style.transform = `translateX(${ropePosition}px)`;
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            if (currentQuestionIdx + 1 < currentQuestions.length) {
                loadQuestion(currentQuestionIdx + 1);
            } else {
                endGame();
            }
        }

        function endGame() {
            isQuestionActive = false;
            clearInterval(timerInterval);
            let winnerText = "🤝 雙方勢均力敵，打成平手！";
            if (ropePosition < -20) winnerText = "🔴 恭喜【紅隊】獲得最終勝利！";
            else if (ropePosition > 20) winnerText = "🔵 恭喜【藍隊】獲得最終勝利！";

            document.getElementById('overlayTitle').innerText = "比賽結束！";
            document.getElementById('overlayDesc').innerText = winnerText;
            document.getElementById('actionBtnArea').style.display = "block";
            document.getElementById('overlayBtn').innerText = "🚀 重新一局 (Enter)";
            document.getElementById('overlay').classList.remove('hidden');
        }

        document.addEventListener('keydown', (e) => {
            // 在輸入框打字時不觸發遊戲按鍵
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

            if (e.key === 'Enter') {
                const overlay = document.getElementById('overlay');
                if (!overlay.classList.contains('hidden') && document.getElementById('actionBtnArea').style.display !== 'none') {
                    startGame();
                    return;
                }
            }

            if (!isQuestionActive) return;
            const k = e.key.toUpperCase();
            if (['Q','W','E','R'].includes(k)) handleAnswer('left', ['Q','W','E','R'].indexOf(k));
            else if (['U','I','O','P'].includes(k)) handleAnswer('right', ['U','I','O','P'].indexOf(k));
        });

        function showLoading(title, desc) {
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('actionBtnArea').style.display = "none";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function showSuccessPrompt(title, desc) {
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('actionBtnArea').style.display = "block";
            document.getElementById('overlayBtn').innerText = "🚀 讀取完成！立即開始比賽 (Enter)";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
