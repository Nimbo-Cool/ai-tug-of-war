<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智慧雙人拔河大對決</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; user-select: none; }
        .rope-transition { transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .pulse-anim { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- 上方控制區與標題 -->
    <header class="p-4 bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🪢</span>
                <h1 class="text-2xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-red-400 via-amber-300 to-blue-400">
                    AI 智慧雙人拔河大對決
                </h1>
            </div>

            <!-- 控制按鈕組 -->
            <div class="flex flex-wrap items-center gap-3">
                <!-- API Key 設定 -->
                <button onclick="promptApiKey()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs flex items-center gap-1.5 transition">
                    <i class="fa-solid font-mono fa-key text-amber-400"></i> API Key 設定
                </button>

                <!-- 主題選擇（點擊直接讓 AI 生成全新題目） -->
                <div class="relative">
                    <select id="topicSelect" onchange="generateQuestionsByTopic(this.value)" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold text-amber-300 cursor-pointer focus:outline-none">
                        <option value="" disabled selected>✨ 選擇 AI 主題（每次出題不同）</option>
                        <option value="自然科學小常識">🌱 自然科學小常識</option>
                        <option value="成語典故與成語接龍">📚 成語典故與活用</option>
                        <option value="台灣歷史與地理人文">🗺️ 台灣歷史與地理</option>
                        <option value="日常生活生活常識與安全">💡 日常生活與安全常識</option>
                        <option value="國小基礎英文單字與文法">🔤 基礎英文單字與語感</option>
                        <option value="趣味數學邏輯推理">🔢 趣味數學與邏輯腦筋急轉彎</option>
                    </select>
                </div>

                <!-- 匯入 PDF / 文字按鈕 -->
                <label class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold cursor-pointer transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-file-pdf"></i> 匯入教冊 PDF / 檔案
                    <input type="file" id="pdfInput" accept=".pdf,.txt" class="hidden" onchange="handleFileUpload(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- 遊戲主舞台 -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col justify-between relative">
        
        <!-- 拔河比分與進度條 -->
        <div class="bg-slate-800/80 backdrop-blur p-4 rounded-2xl border border-slate-700 mb-4 shadow-xl">
            <div class="flex justify-between items-center mb-2 px-2">
                <div class="flex items-center gap-2">
                    <span class="w-4 h-4 rounded-full bg-red-500 inline-block animate-ping"></span>
                    <span class="font-bold text-red-400 text-lg">紅隊（左邊）</span>
                </div>
                <div class="text-center">
                    <span id="questionProgress" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 font-mono">第 1 / 10 題</span>
                    <div id="timer" class="text-2xl font-black text-amber-400 mt-1">15</div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-blue-400 text-lg">藍隊（右邊）</span>
                    <span class="w-4 h-4 rounded-full bg-blue-500 inline-block animate-ping"></span>
                </div>
            </div>

            <!-- 拔河賽道 -->
            <div class="relative h-20 bg-slate-900 rounded-xl overflow-hidden border-2 border-slate-700 flex items-center justify-center">
                <!-- 中心線 -->
                <div class="absolute inset-y-0 w-1 bg-amber-400 z-10 left-1/2 -translate-x-1/2 opacity-70"></div>
                <div class="absolute top-1 left-1/2 -translate-x-1/2 text-[10px] text-amber-400 font-mono z-10">勝負中線</div>

                <!-- 繩子與人物容器 -->
                <div id="ropeContainer" class="absolute w-full flex items-center justify-center rope-transition" style="transform: translateX(0px);">
                    <!-- 左隊選手 -->
                    <div class="flex items-center gap-1 mr-[-10px]">
                        <span class="text-4xl transform -scale-x-100">🤼</span>
                        <span class="text-3xl transform -scale-x-100">🧒</span>
                    </div>
                    <!-- 繩子與紅結 -->
                    <div class="w-2/3 h-4 bg-amber-700 border-y-2 border-amber-900 relative flex items-center justify-center shadow-inner">
                        <div class="w-6 h-8 bg-red-600 rounded-sm shadow-md animate-bounce"></div>
                    </div>
                    <!-- 右隊選手 -->
                    <div class="flex items-center gap-1 ml-[-10px]">
                        <span class="text-3xl">🧒</span>
                        <span class="text-4xl">🤼</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 題目顯示區 -->
        <div class="bg-slate-800/90 rounded-2xl p-6 border border-slate-700 shadow-2xl min-h-[140px] flex flex-col justify-center items-center text-center my-2 relative">
            <div id="topicTag" class="absolute top-3 left-4 text-xs font-bold text-indigo-400 bg-indigo-950/80 border border-indigo-800 px-2.5 py-1 rounded-md">
                主題：自然科學小常識
            </div>
            <h2 id="questionText" class="text-xl md:text-2xl font-bold leading-relaxed text-slate-100 mt-4">
                題目載入中...
            </h2>
        </div>

        <!-- 雙人搶答選項區（左隊 vs 右隊） -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 my-2">
            <!-- 紅隊選項區（按鍵 Q, W, E, R） -->
            <div class="bg-red-950/30 border-2 border-red-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2">
                <div class="text-xs font-bold text-red-400 flex justify-between items-center mb-1">
                    <span>🔴 紅隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：Q, W, E, R</span>
                </div>
                <div id="leftOptions" class="grid grid-cols-1 gap-2">
                    <!-- JavaScript 動態生成按鈕 -->
                </div>
            </div>

            <!-- 藍隊選項區（按鍵 U, I, O, P） -->
            <div class="bg-blue-950/30 border-2 border-blue-900/50 rounded-2xl p-4 shadow-lg flex flex-col gap-2">
                <div class="text-xs font-bold text-blue-400 flex justify-between items-center mb-1">
                    <span>🔵 藍隊搶答區</span>
                    <span class="text-[11px] opacity-80">按鍵：U, I, O, P</span>
                </div>
                <div id="rightOptions" class="grid grid-cols-1 gap-2">
                    <!-- JavaScript 動態生成按鈕 -->
                </div>
            </div>
        </div>

    </main>

    <!-- 載入與遮罩狀態區 -->
    <div id="overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="overlayContent" class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
            <div class="text-5xl mb-4">🪢</div>
            <h3 id="overlayTitle" class="text-2xl font-bold mb-2 text-amber-400">AI 智慧拔河大對決</h3>
            <p id="overlayDesc" class="text-slate-300 text-sm mb-6 leading-relaxed">
                點擊下方按鈕或選取上方主題，讓 AI 即時生成全新題目開始對決！
            </p>
            <button id="overlayBtn" onclick="startGame()" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl text-lg shadow-lg transform transition active:scale-95">
                🚀 開始遊戲 (Enter)
            </button>
        </div>
    </div>

    <script>
        // 全域變數
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let currentQuestions = [];
        let currentQuestionIdx = 0;
        let ropePosition = 0; // -100 (左勝) 到 100 (右勝)
        let timerInterval = null;
        let timeLeft = 15;
        let isQuestionActive = false;
        let leftAnswered = false;
        let rightAnswered = false;

        // 預設題目 (備用)
        const defaultQuestions = [
            { q: "下列哪一種動物屬於哺乳類動物？", options: ["企鵝", "海豚", "鱷魚", "綠蠵龜"], answer: 1, explanation: "海豚用肺呼吸且胎生哺乳，屬於哺乳類。" },
            { q: "植物進行光合作用時，主要吸收哪種氣體？", options: ["氧氣", "二氧化碳", "氮氣", "氫氣"], answer: 1, explanation: "植物吸收二氧化碳與水，利用陽光製造養分與氧氣。" },
            { q: "地球繞太陽公轉一圈大約需要多久時間？", options: ["1 天", "1 個月", "1 年", "10 年"], answer: 2, explanation: "地球公轉一圈約為 365 天（一年）。" },
            { q: "水在常壓下加熱到幾度會沸騰變成水蒸氣？", options: ["50℃", "80℃", "100℃", "200℃"], answer: 2, explanation: "水的標準沸點為 100 攝氏度。" },
            { q: "「百折不撓」這個成語常用來形容什麼樣的精神？", options: ["意志堅定不屈", "辦事效率極高", "性格十分隨和", "學習速度飛快"], answer: 0, explanation: "百折不撓指遭受挫折仍不屈服。" }
        ];

        window.onload = function() {
            currentQuestions = [...defaultQuestions];
            showStartOverlay("預設基礎題庫", "點擊開始按鈕即可開始拔河！兩隊可同時搶答。");
        };

        function promptApiKey() {
            const key = prompt("請輸入您的 Gemini API Key：", apiKey);
            if (key !== null) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
                alert(apiKey ? "API Key 設定成功！" : "已清除 API Key。");
            }
        }

        // 選擇主題後，讓 AI 即時生成全新 10 題
        async function generateQuestionsByTopic(topic) {
            if (!topic) return;

            showLoading(`AI 正在針對「${topic}」出題中...`, "請稍候 5~10 秒，AI 正在生成全新 10 道趣味題目");

            const prompt = `請針對主題「${topic}」，為國小/國中學生設計 10 道全新且不重複的四選一單選題。
            請勿出重複題目。每次生成的題目請確保隨機與豐富度。
            請嚴格以 JSON 格式輸出陣列，結構如下：
            [
              {
                "q": "題目敘述",
                "options": ["選項0", "選項1", "選項2", "選項3"],
                "answer": 正確選項索引數字(0-3),
                "explanation": "簡短解析"
              }
            ]`;

            try {
                const generated = await callGeminiAI(prompt);
                if (generated && generated.length > 0) {
                    currentQuestions = generated;
                    document.getElementById('topicTag').innerText = `主題：${topic}`;
                    showStartOverlay(`主題：${topic}`, `AI 已為您成功生成 ${generated.length} 道全新題目！`);
                } else {
                    throw new Error("生成結果格式不符");
                }
            } catch (err) {
                alert("AI 出題失敗：" + err.message + "\n已切回備用題庫。");
                currentQuestions = [...defaultQuestions];
                showStartOverlay("預設題庫", "點擊開始遊戲。");
            }
        }

        // 上傳 PDF 檔案解析出題
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading("正在讀取檔案與解析內文...", "準備將教材傳送給 AI 出題");

            try {
                let textContent = "";
                if (file.name.endsWith('.pdf')) {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        showLoading(`正在讀取 PDF 頁數 (${i}/${pdf.numPages})...`, "萃取教材文字中");
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        textContent += content.items.map(item => item.str).join(" ") + "\n";
                    }
                } else {
                    textContent = await file.text();
                }

                textContent = textContent.slice(0, 15000); // 截取前 15,000 字精華

                showLoading("AI 正在閱讀教材並生成 10 題測驗...", "分析重點內容中");

                const prompt = `請根據以下教材內文，出 10 道適合學生的四選一選擇題：\n\n${textContent}\n\n
                請嚴格以 JSON 格式輸出陣列：
                [
                  {
                    "q": "問題",
                    "options": ["選項0", "選項1", "選項2", "選項3"],
                    "answer": 0,
                    "explanation": "解析"
                  }
                ]`;

                const generated = await callGeminiAI(prompt);
                if (generated && generated.length > 0) {
                    currentQuestions = generated;
                    document.getElementById('topicTag').innerText = `來源：${file.name}`;
                    showStartOverlay(`課本彙編：${file.name}`, `AI 已針對教材內容生成 ${generated.length} 題測驗！`);
                } else {
                    throw new Error("解析結果無有效題目");
                }
            } catch (err) {
                alert("檔案讀取或出題失敗：" + err.message);
                hideOverlay();
            }
        }

        // 呼叫 Gemini API
        async function callGeminiAI(promptText) {
            if (!apiKey) {
                const inputKey = prompt("請輸入 Gemini API Key 以使用 AI 出題功能：");
                if (!inputKey) throw new Error("缺少 API Key");
                apiKey = inputKey.trim();
                localStorage.setItem('gemini_api_key', apiKey);
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) {
                throw new Error(`API 請求錯誤 (${response.status})`);
            }

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            return JSON.parse(rawText);
        }

        // 開始遊戲
        function startGame() {
            hideOverlay();
            currentQuestionIdx = 0;
            ropePosition = 0;
            updateRopeUI();
            loadQuestion(0);
        }

        // 載入單一題目
        function loadQuestion(idx) {
            if (idx >= currentQuestions.length) {
                endGame();
                return;
            }

            isQuestionActive = true;
            leftAnswered = false;
            rightAnswered = false;
            currentQuestionIdx = idx;

            const qData = currentQuestions[idx];
            document.getElementById('questionProgress').innerText = `第 ${idx + 1} / ${currentQuestions.length} 題`;
            document.getElementById('questionText').innerText = qData.q;

            // 渲染左隊與右隊選項
            const keysLeft = ['Q', 'W', 'E', 'R'];
            const keysRight = ['U', 'I', 'O', 'P'];

            renderOptionGroup('leftOptions', qData.options, keysLeft, 'left');
            renderOptionGroup('rightOptions', qData.options, keysRight, 'right');

            // 開始倒數計時
            startTimer();
        }

        function renderOptionGroup(containerId, options, keys, team) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl border text-sm font-bold flex items-center justify-between transition ${
                    team === 'left' 
                    ? 'bg-slate-800 hover:bg-red-900/40 border-slate-700 hover:border-red-500' 
                    : 'bg-slate-800 hover:bg-blue-900/40 border-slate-700 hover:border-blue-500'
                }`;
                btn.innerHTML = `
                    <span><b class="text-amber-400 mr-2">${i+1}.</b> ${opt}</span>
                    <span class="text-[10px] bg-slate-700 px-2 py-0.5 rounded font-mono">${keys[i]}</span>
                `;
                btn.onclick = () => handleAnswer(team, i);
                container.appendChild(btn);
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timer').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function handleAnswer(team, optionIdx) {
            if (!isQuestionActive) return;

            const qData = currentQuestions[currentQuestionIdx];
            const isCorrect = (optionIdx === qData.answer);

            if (team === 'left' && !leftAnswered) {
                leftAnswered = true;
                disableOptionGroup('leftOptions');
                if (isCorrect) ropePosition -= 20; // 紅隊向左拉
            } else if (team === 'right' && !rightAnswered) {
                rightAnswered = true;
                disableOptionGroup('rightOptions');
                if (isCorrect) ropePosition += 20; // 藍隊向右拉
            }

            updateRopeUI();

            // 兩隊皆已作答或拉到底則進入下一題
            if (leftAnswered && rightAnswered) {
                setTimeout(nextQuestion, 1000);
            }
        }

        function disableOptionGroup(containerId) {
            const btns = document.querySelectorAll(`#${containerId} button`);
            btns.forEach(btn => btn.disabled = true);
        }

        function updateRopeUI() {
            // 限制繩子位置在 -120px 到 +120px 之間
            ropePosition = Math.max(-120, Math.min(120, ropePosition));
            document.getElementById('ropeContainer').style.transform = `translateX(${ropePosition}px)`;
        }

        function nextQuestion() {
            clearInterval(timerInterval);
            if (currentQuestionIdx + 1 < currentQuestions.length) {
                loadQuestion(currentQuestionIdx + 1);
            } else {
                endGame();
            }
        }

        function endGame() {
            isQuestionActive = false;
            let winnerText = "🤝 雙方勢均力敵，打成平手！";
            if (ropePosition < -20) winnerText = "🔴 恭喜【紅隊】獲得最終勝利！";
            else if (ropePosition > 20) winnerText = "🔵 恭喜【藍隊】獲得最終勝利！";

            showStartOverlay("比賽結束！", winnerText);
            document.getElementById('overlayBtn').innerText = "🔄 重新一局";
        }

        // 鍵盤快捷鍵 (QWER & UIOP, Enter 開始)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const overlay = document.getElementById('overlay');
                if (!overlay.classList.contains('hidden')) {
                    startGame();
                    return;
                }
            }

            if (!isQuestionActive) return;
            const k = e.key.toUpperCase();
            if (['Q','W','E','R'].includes(k)) {
                handleAnswer('left', ['Q','W','E','R'].indexOf(k));
            } else if (['U','I','O','P'].includes(k)) {
                handleAnswer('right', ['U','I','O','P'].indexOf(k));
            }
        });

        // 介面遮罩控制
        function showStartOverlay(title, desc) {
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('overlayBtn').innerText = "🚀 開始遊戲 (Enter)";
            document.getElementById('overlayBtn').style.display = "block";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function showLoading(title, desc) {
            document.getElementById('overlayTitle').innerText = title;
            document.getElementById('overlayDesc').innerText = desc;
            document.getElementById('overlayBtn').style.display = "none";
            document.getElementById('overlay').classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }
    </script>
</body>
</html>
